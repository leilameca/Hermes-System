<ion-content>
  <main class="password-shell">
    <section class="password-card">
      <img src="assets/brand/hermes-logo.jpeg" alt="Hermes System">
      <p class="eyebrow">Seguridad de la cuenta</p>
      <h1>Crea tu contraseña personal</h1>
      <p>La empresa te entregó una contraseña temporal. Cámbiala antes de continuar.</p>
      <form (ngSubmit)="submit()">
        @if (error) { <p class="error" role="alert">{{ error }}</p> }
        <label>Nueva contraseña<input name="password" type="password" [(ngModel)]="password" autocomplete="new-password" minlength="8" required></label>
        <label>Confirmar contraseña<input name="confirmation" type="password" [(ngModel)]="confirmation" autocomplete="new-password" minlength="8" required></label>
        <button class="primary" type="submit" [disabled]="loading || !password || !confirmation">{{ loading ? 'Guardando…' : 'Guardar y continuar' }}</button>
        <button class="secondary" type="button" (click)="logout()">Cerrar sesión</button>
      </form>
    </section>
  </main>
</ion-content>
