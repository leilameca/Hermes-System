<ion-header>
  <ion-toolbar>
    <ion-title>Unidad 7 - Multimedia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Mi Galería Multimedia</h2>
  
  <ion-card>
    <img src="assets/images/vehicles/corolla.jpg" />
    <ion-card-header>
      <ion-card-title>Imagen de Ejemplo</ion-card-title>
    </ion-card-header>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Video de Ejemplo</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <video width="100%" controls>
        <source src="assets/Video/promo.mp4" type="video/mp4">
      </video>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Audio de Ejemplo</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <audio controls style="width: 100%;">
        <source src="assets/Audio/promo.mp3" type="audio/mpeg">
      </audio>
    </ion-card-content>
  </ion-card>

</ion-content>
